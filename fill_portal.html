<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>进销存填报门户</title>
<style>

  body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#eef2f6;color:#1f2937;padding-bottom:90px}
  .header{background:linear-gradient(135deg,#0f3d5c,#1d6fa5);color:#fff;padding:18px 24px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(15,61,92,.2)}

  .header h1{font-size:19px}
  .header .sub{font-size:12px;opacity:.85;margin-top:3px}
  .header .right{display:flex;align-items:center;gap:12px}
  .header .wk{font-size:12px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:6px}
  .logout{cursor:pointer;background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:6px;padding:6px 12px;font-size:12px}
  .logout:hover{background:rgba(255,255,255,.28)}
  /* 登录页 */
  .login-wrap{max-width:400px;margin:80px auto;background:#fff;border-radius:14px;padding:34px 32px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
  .login-wrap h2{font-size:20px;color:#0f3d5c;text-align:center;margin-bottom:6px}
  .login-wrap .lg-sub{font-size:12px;color:#6b7280;text-align:center;margin-bottom:24px}
  .lbl{font-size:12px;color:#374151;margin-bottom:4px;display:block}
  .inp{width:100%;padding:11px 12px;border:1.5px solid #d1d5db;border-radius:8px;font-size:14px;margin-bottom:16px}
  .inp:focus{outline:none;border-color:#1d6fa5;box-shadow:0 0 0 3px rgba(29,111,165,.12)}
  .btn-login{width:100%;background:#1d6fa5;color:#fff;border:none;border-radius:8px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
  .btn-login:hover{background:#164e72}
  .lg-err{color:#dc2626;font-size:13px;margin-top:10px;text-align:center;display:none}
  .remember{font-size:12px;color:#6b7280;margin-top:12px;text-align:center}
  /* 填报 */
  .tip{max-width:1100px;margin:14px auto 0;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:8px;padding:10px 14px;font-size:13px;line-height:1.6}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  .group{background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px}
  .group-h{font-size:16px;font-weight:700;color:#111827;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .g-n{font-size:11px;font-weight:500;color:#6b7280;background:#f0f2f5;padding:2px 8px;border-radius:4px}
  table{width:100%;border-collapse:collapse}
  .fill-tbl th,.fill-tbl td{border:1px solid #eef2f7;padding:8px;text-align:center;font-size:13px}
  .fill-tbl th{background:#f8fafc;color:#374151;font-weight:600}
  .fill-tbl th small{color:#9ca3af;font-weight:400}
  .fill-tbl td.sku{text-align:left;font-family:ui-monospace,Consolas,monospace;font-size:12px}
  .end-input{width:80px;padding:6px 8px;border:1.5px solid #cbd5e1;border-radius:6px;font-size:14px;text-align:center;font-weight:600;color:#111827}
  .end-input:focus{outline:none;border-color:#1d6fa5;box-shadow:0 0 0 3px rgba(29,111,165,.15)}
  td.num{font-variant-numeric:tabular-nums}
  td.sale{font-weight:600;color:#059669}
  .add{background:#f8fafc;border:1.5px dashed #cbd5e1;border-radius:10px;padding:14px;text-align:center;cursor:pointer;color:#1d6fa5;font-weight:600;font-size:14px;transition:.15s}

  /* 选择弹窗 */
  .mask{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}

  .modal-h b{font-size:16px}
  .modal-close{cursor:pointer;background:#f3f4f6;border:none;border-radius:6px;width:28px;height:28px;font-size:16px;line-height:1;color:#6b7280}
  .modal-body{overflow-y:auto;padding:14px 18px 18px}
  .modal-tip{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:6px;padding:8px 12px;font-size:12px;margin-bottom:12px}
  .pl-group{margin-bottom:14px}
  .pl-title{font-size:13px;font-weight:700;color:#374151;margin-bottom:6px}
  .pl-n{font-size:11px;color:#6b7280;font-weight:500;margin-left:4px}

  .pl-chip{border:1px solid #e2e8f0;background:#f8fafc;border-radius:6px;padding:5px 10px;font-size:12px;font-family:ui-monospace,Consolas,monospace;cursor:pointer;transition:.12s}

  .pl-own{color:#94a3b8;font-size:10px;margin-left:4px;font-weight:600}
  .pl-note{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:6px;padding:8px 12px;font-size:12px;margin-bottom:12px}
  .pl-empty{color:#9ca3af;font-size:13px;text-align:center;padding:20px}
  .bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;padding:12px 24px;display:flex;justify-content:center;gap:14px;align-items:center;z-index:60;box-shadow:0 -2px 10px rgba(0,0,0,.06)}

  .btn-save{background:#1d6fa5;color:#fff;border:none;border-radius:8px;padding:12px 34px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 2px 6px rgba(29,111,165,.3)}

  .toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:10px 24px;border-radius:8px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.2);display:none;z-index:300}
  .toast.show{display:block;animation:pop .25s}
  @keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(-6px)}to{opacity:1;transform:translateX(-50%)}}

<body>
<!-- 登录界面 -->
<div id="loginView">
  <div class="login-wrap">

    <div class="lg-sub">请登录后查看您的库存填报</div>

    <input class="inp" id="userInput" placeholder="输入用户名" autocomplete="username" />
    <label class="lbl">密码</label>

    <div class="lg-err" id="loginErr">用户名或密码错误</div>
    <button class="btn-login" onclick="doLogin()">登 录</button>
    <div class="remember">密码可找公司业务员索取</div>
  </div>
</div>

<div id="fillView" style="display:none">

      </div>
      <div class="right">

        <button class="logout" onclick="doLogout()">退出</button>
      </div>
    </div>
  </div>
  <div class="tip">💡 <b>本周只需填「本周期末库存」一列</b>：上周库存、本周到货已帮你填好，销量自动算出（= 上周库存 + 到货 − 期末）。库存没变的型号不用动。需要加新型号点下面「＋添加型号」，从列表里选。</div>
  <div class="wrap">
    <div id="groupsBox"></div>
    <div class="add" id="addBtn" onclick="openPickModal()">＋ 添加新型号（点这里从列表选，不用手输）</div>
  </div>
  <div class="bar">
    <span class="stat" id="stat">已填 0 项</span>
    <button class="btn-save" id="saveBtn" onclick="doSave()">保 存</button>
  </div>
</div>

<!-- 型号选择弹窗 -->
<div class="mask" id="pickMask">
  <div class="modal">

    <div class="modal-body" id="pickBody"></div>
  </div>
</div>
<div class="toast" id="toast">✅ 保存成功，谢谢！</div>

let current = null;

// ---- 登录 ----
function doLogin() {
  const u = document.getElementById('userInput').value.trim();
  const p = document.getElementById('passInput').value;
  const acc = LOGINS.find(a => a.user === u && a.pass === p);
  if (!acc) { document.getElementById('loginErr').style.display = 'block'; return; }
  current = acc;
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('fillView').style.display = 'block';
  document.getElementById('curName').textContent = acc.name;
  // 渲染该客户的填报表 + 可选型号池
  const st = STATES.find(s => s.name === acc.name);
  document.getElementById('groupsBox').innerHTML = st ? st.g : '<div class="tip">暂无数据</div>';
  document.getElementById('pickBody').innerHTML = '<div class="pl-note">💡 灰色=你已拥有（不可重复添加），白色=可点击添加。<br>共 80 个可选型号，按品类分组。</div>' + (acc.pool || '<div class="pl-empty">暂无型号</div>');
  // 绑定交互
  bindAll();
  document.getElementById('stat').textContent = '已填 0 项';
  document.getElementById('loginErr').style.display = 'none';
}
function doLogout() {
  current = null;
  document.getElementById('fillView').style.display = 'none';
  document.getElementById('loginView').style.display = 'block';
  document.getElementById('userInput').value = '';
  document.getElementById('passInput').value = '';
}
document.getElementById('passInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('userInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// ---- 绑定：期末库存输入 -> 自动算销量；型号chip -> 添加 ----
function bindAll() {
  document.querySelectorAll('#groupsBox .end-input').forEach(inp => {
    inp.addEventListener('input', () => {
      const tr = inp.closest('tr');
      const prev = +tr.querySelector('.prev').textContent || 0;
      const arrive = +tr.querySelector('.arrive').textContent || 0;
      const end = +inp.value || 0;
      tr.querySelector('.sale').textContent = Math.max(0, prev + arrive - end);
      countFilled();
    });
  });
  document.querySelectorAll('#pickBody .pl-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const owned = chip.hasAttribute('data-owned') || chip.classList.contains('owned');
      if (owned) { toastMsg('该型号已在你的表里'); return; }
      const sku = chip.getAttribute('data-sku');
      const type = chip.getAttribute('data-type');
      if (document.querySelector('#groupsBox tr[data-sku="'+CSS.escape(sku)+'"]')) { toastMsg('该型号已在表里'); return; }
      addRowToGroups(sku, type);
      chip.remove();
      toastMsg('已添加型号：' + sku);
    });
  });
}
function countFilled() {
  let n = 0; document.querySelectorAll('#groupsBox .end-input').forEach(i => { if (i.value !== '') n++; });
  document.getElementById('stat').textContent = '已填 ' + n + ' 项';
}
function addRowToGroups(sku, type) {
  let group = [...document.querySelectorAll('#groupsBox .group')].find(g => g.querySelector('.group-h') && g.querySelector('.group-h').textContent.trim().startsWith(type));
  let tbody;
  if (group) {
    tbody = group.querySelector('tbody');
    group.querySelector('.g-n').textContent = group.querySelectorAll('tr[data-sku]').length + ' 个在经营型号';
  } else {
    group = document.createElement('div'); group.className = 'group';
    group.innerHTML = '<div class="group-h">'+type+' <span class="g-n">1 个在经营型号</span></div><table class="fill-tbl"><thead><tr><th>产品型号</th><th>上周库存<br><small>自动</small></th><th>本周到货<br><small>后台已填</small></th><th>本周期末库存<br><small>请填写</small></th><th>销量<br><small>自动算</small></th></tr></thead><tbody></tbody></table>';
    const addBtn = document.getElementById('addBtn');
    addBtn.parentNode.insertBefore(group, addBtn);
    tbody = group.querySelector('tbody');
  }
  const tr = document.createElement('tr');
  tr.setAttribute('data-sku', sku);
  tr.innerHTML = '<td class="sku">'+sku.replace(/</g,'&lt;')+'</td><td class="num prev">0</td><td class="num arrive">0</td><td class="num"><input type="number" class="end-input" min="0" placeholder="填期末" /></td><td class="num sale">0</td>';
  tbody.appendChild(tr);
  tr.querySelector('.end-input').addEventListener('input', () => {
    const prev = +tr.querySelector('.prev').textContent || 0;
    const arrive = +tr.querySelector('.arrive').textContent || 0;
    const end = +tr.querySelector('.end-input').value || 0;
    tr.querySelector('.sale').textContent = Math.max(0, prev + arrive - end);
    countFilled();
  });
}
function openPickModal(){ document.getElementById('pickMask').classList.add('open'); }
function closePickModal(){ document.getElementById('pickMask').classList.remove('open'); }
document.getElementById('pickMask').addEventListener('click', e => { if(e.target.id==='pickMask') closePickModal(); });

// ---- 保存 ----
function doSave() {
  if (!current) return;
  const rows = [];
  document.querySelectorAll('#groupsBox tr[data-sku]').forEach(tr => {
    const sku = tr.getAttribute('data-sku');
    const end = +tr.querySelector('.end-input')?.value || 0;
    rows.push({ sku, end });
  });
  let filled = 0; document.querySelectorAll('#groupsBox .end-input').forEach(i => { if (i.value !== '') filled++; });
  if (filled === 0) { alert('您还没有填写任何期末库存。请至少填一个型号的本周期末库存。'); return; }
  console.log('保存数据:', JSON.stringify({ customer: current.name, week: '第35周(2026.08.24-08.30)', rows: rows.filter(r=>r.end>0) }));
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = '保存中…';
  setTimeout(() => { toastMsg('✅ 保存成功，谢谢！'); btn.disabled = false; btn.textContent = '保 存'; }, 800);
}
function toastMsg(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
