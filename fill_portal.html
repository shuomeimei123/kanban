<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>进销存填报门户</title>
<style>

  .header h1{font-size:19px}
  .header .sub{font-size:12px;opacity:.85;margin-top:3px}
  .header .right{display:flex;align-items:center;gap:12px}
  .header .wk{font-size:12px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:6px}
  .logout{cursor:pointer;background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:6px;padding:6px 12px;font-size:12px}
  .logout:hover{background:rgba(255,255,255,.28)}
  /* 登录页 */

  .login-wrap h2{font-size:20px;color:#0f3d5c;text-align:center;margin-bottom:6px}
  .login-wrap .lg-sub{font-size:12px;color:#6b7280;text-align:center;margin-bottom:24px}
  .lbl{font-size:12px;color:#374151;margin-bottom:4px;display:block}
  .inp{width:100%;padding:11px 12px;border:1.5px solid #d1d5db;border-radius:8px;font-size:14px;margin-bottom:16px}
  .inp:focus{outline:none;border-color:#1d6fa5;box-shadow:0 0 0 3px rgba(29,111,165,.12)}
  .btn-login{width:100%;background:#1d6fa5;color:#fff;border:none;border-radius:8px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
  .btn-login:hover{background:#164e72}
  .lg-err{color:#dc2626;font-size:13px;margin-top:10px;text-align:center;display:none}
  .remember{font-size:12px;color:#6b7280;margin-top:12px;text-align:center}
  /* 填报 */
  .tip{max-width:1100px;margin:14px auto 0;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:8px;padding:10px 14px;font-size:13px;line-height:1.6}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}

  .group-h{font-size:16px;font-weight:700;color:#111827;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .g-n{font-size:11px;font-weight:500;color:#6b7280;background:#f0f2f5;padding:2px 8px;border-radius:4px}
  table{width:100%;border-collapse:collapse}

  .fill-tbl th{background:#f8fafc;color:#374151;font-weight:600}
  .fill-tbl th small{color:#9ca3af;font-weight:400}
  .fill-tbl td.sku{text-align:left;font-family:ui-monospace,Consolas,monospace;font-size:12px}

  td.sale{font-weight:600;color:#059669}

<div id="loginView">

  </div>
</div>

function doLogin() {
  const u = document.getElementById('userInput').value.trim();
  const p = document.getElementById('passInput').value;
  const acc = LOGINS.find(a => a.user === u && a.pass === p);
  if (!acc) { document.getElementById('loginErr').style.display = 'block'; return; }
  current = acc;
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('fillView').style.display = 'block';
  document.getElementById('curName').textContent = acc.name;
  // 渲染该客户的填报表 + 可选型号池
  const st = STATES.find(s => s.name === acc.name);
  document.getElementById('groupsBox').innerHTML = st ? st.g : '<div class="tip">暂无数据</div>';
  document.getElementById('pickBody').innerHTML = '<div class="modal-tip">点击下面型号即可添加（只列你没有的型号）。</div>' + (acc.pool || '<div class="pl-empty">暂无其他可选型号</div>');
  // 绑定交互
  bindAll();
  document.getElementById('stat').textContent = '已填 0 项';
  document.getElementById('loginErr').style.display = 'none';
}
function doLogout() {
  current = null;
  document.getElementById('fillView').style.display = 'none';
  document.getElementById('loginView').style.display = 'block';
  document.getElementById('userInput').value = '';
  document.getElementById('passInput').value = '';
}
document.getElementById('passInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('userInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// ---- 绑定：期末库存输入 -> 自动算销量；型号chip -> 添加 ----
function bindAll() {
  document.querySelectorAll('#groupsBox .end-input').forEach(inp => {
    inp.addEventListener('input', () => {
      const tr = inp.closest('tr');
      const prev = +tr.querySelector('.prev').textContent || 0;
      const arrive = +tr.querySelector('.arrive').textContent || 0;
      const end = +inp.value || 0;
      tr.querySelector('.sale').textContent = Math.max(0, prev + arrive - end);
      countFilled();
    });
  });
  document.querySelectorAll('#pickBody .pl-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const sku = chip.getAttribute('data-sku');
      const type = chip.getAttribute('data-type');
      if (document.querySelector('#groupsBox tr[data-sku="'+CSS.escape(sku)+'"]')) { toastMsg('该型号已在表里'); return; }
      addRowToGroups(sku, type);
      chip.remove();
      toastMsg('已添加型号：' + sku);
    });
  });
}
function countFilled() {
  let n = 0; document.querySelectorAll('#groupsBox .end-input').forEach(i => { if (i.value !== '') n++; });
  document.getElementById('stat').textContent = '已填 ' + n + ' 项';
}
function addRowToGroups(sku, type) {
  let group = [...document.querySelectorAll('#groupsBox .group')].find(g => g.querySelector('.group-h') && g.querySelector('.group-h').textContent.trim().startsWith(type));
  let tbody;
  if (group) {
    tbody = group.querySelector('tbody');
    group.querySelector('.g-n').textContent = group.querySelectorAll('tr[data-sku]').length + ' 个在经营型号';
  } else {
    group = document.createElement('div'); group.className = 'group';
    group.innerHTML = '<div class="group-h">'+type+' <span class="g-n">1 个在经营型号</span></div><table class="fill-tbl"><thead><tr><th>产品型号</th><th>上周库存<br><small>自动</small></th><th>本周到货<br><small>后台已填</small></th><th>本周期末库存<br><small>请填写</small></th><th>销量<br><small>自动算</small></th></tr></thead><tbody></tbody></table>';
    const addBtn = document.getElementById('addBtn');
    addBtn.parentNode.insertBefore(group, addBtn);
    tbody = group.querySelector('tbody');
  }
  const tr = document.createElement('tr');
  tr.setAttribute('data-sku', sku);
  tr.innerHTML = '<td class="sku">'+sku.replace(/</g,'&lt;')+'</td><td class="num prev">0</td><td class="num arrive">0</td><td class="num"><input type="number" class="end-input" min="0" placeholder="填期末" /></td><td class="num sale">0</td>';
  tbody.appendChild(tr);
  tr.querySelector('.end-input').addEventListener('input', () => {
    const prev = +tr.querySelector('.prev').textContent || 0;
    const arrive = +tr.querySelector('.arrive').textContent || 0;
    const end = +tr.querySelector('.end-input').value || 0;
    tr.querySelector('.sale').textContent = Math.max(0, prev + arrive - end);
    countFilled();
  });
}
function openPickModal(){ document.getElementById('pickMask').classList.add('open'); }
function closePickModal(){ document.getElementById('pickMask').classList.remove('open'); }
document.getElementById('pickMask').addEventListener('click', e => { if(e.target.id==='pickMask') closePickModal(); });

// ---- 保存 ----
function doSave() {
  if (!current) return;
  const rows = [];
  document.querySelectorAll('#groupsBox tr[data-sku]').forEach(tr => {
    const sku = tr.getAttribute('data-sku');
    const end = +tr.querySelector('.end-input')?.value || 0;
    rows.push({ sku, end });
  });
  let filled = 0; document.querySelectorAll('#groupsBox .end-input').forEach(i => { if (i.value !== '') filled++; });
  if (filled === 0) { alert('您还没有填写任何期末库存。请至少填一个型号的本周期末库存。'); return; }
  console.log('保存数据:', JSON.stringify({ customer: current.name, week: '第35周(2026.08.24-08.30)', rows: rows.filter(r=>r.end>0) }));
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = '保存中…';
  setTimeout(() => { toastMsg('✅ 保存成功，谢谢！'); btn.disabled = false; btn.textContent = '保 存'; }, 800);
}
function toastMsg(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
